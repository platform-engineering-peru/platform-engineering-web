name: Validate community admin E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e_disposable_only
          POSTGRES_DB: admin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admin_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
        working-directory: community-admin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            community-admin/package-lock.json
      - name: Install website contract dependencies
        working-directory: .
        run: npm ci
      - name: Install admin dependencies
        run: npm ci
      - name: Install browser and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Run isolated admin E2E
        id: e2e
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://postgres:e2e_disposable_only@127.0.0.1:5432/admin_e2e
          TMPDIR: ${{ runner.temp }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          INTEGRATIONS_LIVE_ENABLED: "false"
          JOBS_WEBSITE_WRITES: "0"
      # Upload only the synthetic-run report and failure images. Traces, logs,
      # builds and private temporary storage are deliberately outside this list.
      - name: Retain E2E report and synthetic failure screenshots
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            community-admin/.local/qa/e2e/*/report.json
            community-admin/.local/qa/e2e/*/*/failure.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
