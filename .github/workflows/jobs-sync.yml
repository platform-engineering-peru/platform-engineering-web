name: Collect reviewed job sources
on:
  schedule:
    - cron: "17 12,21 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobs-sync
  cancel-in-progress: false
jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Fetch and validate reviewed public sources
        run: node scripts/jobs/collect.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: normalized-public-jobs
          path: .jobs-artifact/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: fetch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: normalized-public-jobs
          path: .jobs-artifact/
      - name: Revalidate checksums and create reviewed content PR
        run: node scripts/jobs/publish.mjs
        env:
          JOBS_APP_ID: ${{ vars.JOBS_APP_ID }}
          JOBS_APP_INSTALLATION_ID: ${{ vars.JOBS_APP_INSTALLATION_ID }}
          JOBS_APP_PRIVATE_KEY: ${{ secrets.JOBS_APP_PRIVATE_KEY }}
