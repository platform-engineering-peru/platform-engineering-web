version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Astro's checker still requires the TypeScript 5/6 compiler API.
    # Revisit when @astrojs/check supports TypeScript 7 without peer overrides.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      three:
        patterns: ["three", "@types/three"]
      astro:
        patterns: ["astro", "@astrojs/check", "@astrojs/sitemap"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
